services:
  assistant-reponse:
    build: .
    ports:
      - "4321:4321"
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      REPLY_AI_MODE: hybrid
      REPLY_MEMORY_PATH: /data/reply-memory.json
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - ./data:/data
    restart: unless-stopped
